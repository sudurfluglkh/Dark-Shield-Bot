version: '3.8'

services:
  bot:
    build: .
    container_name: dark-shield-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - dark-shield-net

  redis:
    image: redis:7-alpine
    container_name: dark-shield-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - dark-shield-net

networks:
  dark-shield-net:
    driver: bridge
